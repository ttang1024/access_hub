apiVersion: batch/v1
kind: Job
metadata:
  name: cardholder-migrate
  labels:
    app.kubernetes.io/part-of: accesshub
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: accesshub/cardholder
          # Applies EF Core migrations and exits (migrations run at startup only in Development).
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: accesshub-config
          env:
            - name: ConnectionStrings__cardholderdb
              valueFrom:
                secretKeyRef:
                  name: accesshub-connections
                  key: cardholderdb
            - name: ConnectionStrings__messaging
              valueFrom:
                secretKeyRef:
                  name: accesshub-connections
                  key: messaging
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
